name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, staging]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders only. `next build` evaluates modules (e.g. lib/supabase.ts
          # calls createClient at import time) so these must be PRESENT or the build throws.
          # They are never used at runtime - real values are injected by Vercel at deploy.
          NEXT_PUBLIC_URL: https://example.com
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          CLERK_SECRET_KEY: sk_test_placeholder
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
          RESEND_API_KEY: re_placeholder
          COACH_EMAIL: placeholder@example.com
          CLERK_WEBHOOK_SECRET: whsec_placeholder
          QSTASH_TOKEN: placeholder
          DISCORD_BOT_TOKEN: placeholder
          DISCORD_LOG_WEBHOOK_URL: https://discord.test/webhook/log
          DISCORD_BOOKINGS_WEBHOOK_URL: https://discord.test/webhook/bookings
          DISCORD_VC_INVITE_URL: https://discord.gg/placeholder
          GOOGLE_SERVICE_ACCOUNT_EMAIL: svc@placeholder.iam.gserviceaccount.com
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: placeholder
          GOOGLE_CALENDAR_ID: placeholder@example.com
