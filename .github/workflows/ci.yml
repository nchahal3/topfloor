name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, staging]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders so next build doesn't fail on missing public env vars.
          # Real values come from Vercel at deploy time; these are never used at runtime.
          NEXT_PUBLIC_URL: https://example.com
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
